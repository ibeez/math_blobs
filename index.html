<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mathblobs</title>
<meta name="description" content="An interactive concept map for mathematics.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<main id="stage" aria-label="Concept map">
  <div id="board">
    <svg id="edges" aria-hidden="true"></svg>
    <div id="ghosts"></div>
    <div id="blobs"></div>
    <div id="menu"></div>
  </div>
</main>

<div class="wordmark">mathblobs<span id="testBadge" class="test-badge" hidden>test mode</span></div>

<div class="topbar">
  <div class="search">
    <svg width="15" height="15" viewBox="0 0 15 15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="6.2" cy="6.2" r="4.6"/><line x1="9.6" y1="9.6" x2="13.4" y2="13.4"/></svg>
    <input id="search" type="text" placeholder="type a term…" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Type a term to add it">
    <div id="results" role="listbox"></div>
  </div>
  <button id="summaryBtn" class="round-btn student-only hint-feature" aria-pressed="false" title="Show a short summary of this lesson" aria-label="Show a lesson summary">
    <svg width="16" height="16" viewBox="0 0 16 16" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><line x1="2.5" y1="4" x2="13.5" y2="4"/><line x1="2.5" y1="8" x2="13.5" y2="8"/><line x1="2.5" y1="12" x2="9" y2="12"/></svg>
  </button>
  <button id="addBtn" class="round-btn" title="Add a term" aria-label="Add a term">
    <svg width="16" height="16" viewBox="0 0 16 16" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="8" y1="2.4" x2="8" y2="13.6"/><line x1="2.4" y1="8" x2="13.6" y2="8"/></svg>
  </button>
</div>

<div class="under-bar">
  <div id="progress" aria-live="polite"></div>
  <div id="note" class="note" role="status" hidden></div>
  <div id="summary" class="summary" hidden></div>
</div>

<button id="backBtn" class="back-btn" hidden aria-label="Back to the previous map">
  <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="10 3 5 8 10 13"/></svg>
  <span id="backLabel"></span>
</button>

<div class="corner-left">
  <button id="resetBtn" class="pill-btn" title="Restore the demo lessons">reset</button>
  <button id="checkBtn" class="pill-btn student-only hint-feature" title="Check your links against the answer key">check my links</button>
  <button id="hintBtn" class="pill-btn student-only hint-feature" title="A nudge toward a term you have not found">hint</button>
  <button id="revealBtn" class="pill-btn student-only hint-feature" aria-pressed="false" title="Show the core terms and links your map is missing">show what's missing</button>
  <span class="hint">drag to move · click for detail · press and hold to connect</span>
</div>

<div class="switcher">
  <div id="mapGrid" class="map-grid" hidden>
    <div class="map-grid-head"><span>LESSONS</span>
      <div class="mode-toggle" role="group" aria-label="View">
        <button type="button" data-mode="student" aria-pressed="true">my map</button>
        <button type="button" data-mode="key" aria-pressed="false">answer key</button>
      </div>
      <button id="gridClose" class="x" aria-label="Close">✕</button></div>
    <div id="mapCards" class="map-cards"></div>
  </div>
  <button id="mapChip" class="map-chip" aria-haspopup="true">
    <span id="chipDot" class="dot"></span><span id="chipTitle"></span>
    <span class="chev" aria-hidden="true">
      <svg width="11" height="11" viewBox="0 0 16 16" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><line x1="8" y1="2.4" x2="8" y2="13.6"/><line x1="2.4" y1="8" x2="13.6" y2="8"/></svg>
    </span>
  </button>
</div>

<aside id="panel" aria-live="polite"></aside>

<div id="addLayer" class="add-layer" hidden>
  <form id="addForm" class="add-card" autocomplete="off">
    <div class="add-head"><span>NEW TERM</span><button type="button" class="x" data-cancel aria-label="Close">✕</button></div>
    <div class="add-body">
      <div id="addPreview" class="add-preview">Name</div>
      <div class="add-fields">
        <input id="addName" type="text" placeholder="Name" maxlength="40" required>
        <textarea id="addDef" rows="3" placeholder="Definition"></textarea>
        <div id="swatches" class="swatches"></div>
      </div>
    </div>
    <div class="add-actions">
      <button type="button" class="pill-btn" data-cancel>cancel</button>
      <button type="submit" class="pill-btn primary">add to map</button>
    </div>
  </form>
</div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
